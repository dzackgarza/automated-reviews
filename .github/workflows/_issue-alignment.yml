name: Issue alignment (reusable)
on:
  workflow_call:
    inputs:
      issue:
        required: true
        type: number
      infra_ref:
        required: false
        type: string
        default: main
      policy_document:
        required: false
        type: string
        default: CONTRIBUTING.md
jobs:
  alignment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      AI_REVIEW_OPENCODE_BIN: /usr/local/bin/opencode
      AI_REVIEW_OPENCODE_TIMEOUT: '300'
      AI_REVIEW_MAX_ATTEMPTS: '3'
      AI_REVIEW_BACKOFF: '5'
      INFRA_REF: ${{ inputs.infra_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Locate infrastructure clone path
        run: echo "INFRA=$RUNNER_TEMP/automated-reviews" >> "$GITHUB_ENV"
      - name: Clone review infrastructure
        run: git clone --depth 1 --branch "$INFRA_REF" https://github.com/dzackgarza/automated-reviews.git "$INFRA"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install tools
        run: just -f "$INFRA/ci/runner.just" install-tools
      - name: Weigh the issue against repository policy
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          POLICY_DOCUMENT: ${{ inputs.policy_document }}
        run: uv run --project "$INFRA" automated-reviews check-issue-alignment --repo "${GITHUB_REPOSITORY}" --issue "$ISSUE_NUMBER" --task "$INFRA/reviews/issue-alignment/task.md" --manifest "$INFRA/reviews/issue-alignment/manifest.txt" --policy-document "$GITHUB_WORKSPACE/$POLICY_DOCUMENT"
