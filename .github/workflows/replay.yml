name: Replay Review

run-name: Replay ${{ inputs.case }} with ${{ inputs.model }}

on:
  workflow_dispatch:
    inputs:
      case:
        description: Frozen review case
        required: true
        type: choice
        options:
          - sage-categories-pr3-run32660872242
      model:
        description: OpenCode model identifier
        required: true
        type: string
        default: opencode/nemotron-3-ultra-free

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CASE_DIRECTORY: cases/${{ inputs.case }}
      CONTROL_REPO: ${{ github.workspace }}/target
      INFRA: ${{ github.workspace }}/infra
      REPLAY_MODEL: ${{ inputs.model }}
      RESULT_DIRECTORY: ${{ github.workspace }}/results

    steps:
      - name: Check out replay laboratory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true

      - name: Read frozen case
        id: frozen
        run: |
          case_json="$(uv run automated-reviews inspect "$CASE_DIRECTORY")"
          uv run automated-reviews inspect "$CASE_DIRECTORY" >/dev/null
          {
            echo "repository=$(jq -r .repository <<<"$case_json")"
            echo "base_ref=$(jq -r .base_ref <<<"$case_json")"
            echo "base_sha=$(jq -r .base_sha <<<"$case_json")"
            echo "checkout_sha=$(jq -r .checkout_sha <<<"$case_json")"
            echo "infra_sha=$(jq -r .infra_sha <<<"$case_json")"
            echo "report_type=$(jq -r .report_type <<<"$case_json")"
            echo "scope=$(jq -r .scope <<<"$case_json")"
            echo "opencode_version=$(jq -r .opencode_version <<<"$case_json")"
          } >>"$GITHUB_OUTPUT"

      - name: Check out target revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.frozen.outputs.repository }}
          ref: ${{ steps.frozen.outputs.checkout_sha }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Check out review infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dzackgarza/ai-review-ci
          ref: ${{ steps.frozen.outputs.infra_sha }}
          path: infra
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          github-token: ${{ github.token }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Verify frozen source and context
        run: |
          test "$(git -C "$CONTROL_REPO" rev-parse HEAD)" = "${{ steps.frozen.outputs.checkout_sha }}"
          test "$(git -C "$INFRA" rev-parse HEAD)" = "${{ steps.frozen.outputs.infra_sha }}"
          git -C "$CONTROL_REPO" cat-file -e "${{ steps.frozen.outputs.base_sha }}^{commit}"
          git -C "$CONTROL_REPO" update-ref "refs/remotes/origin/${{ steps.frozen.outputs.base_ref }}" "${{ steps.frozen.outputs.base_sha }}"
          sha256sum --check <(printf '%s  %s\n' \
            "$(uv run automated-reviews inspect "$CASE_DIRECTORY" | jq -r .reviewer_context_sha256)" \
            "$CASE_DIRECTORY/reviewer-context.txt")
          cp "$CASE_DIRECTORY/reviewer-context.txt" "$CONTROL_REPO/.reviewer-context.md"

      - name: Install production review tools
        run: env GITHUB_WORKSPACE="$CONTROL_REPO" just -f "$INFRA/ci/runner.just" install-tools

      - name: Pin OpenCode version
        run: |
          bun add --global "opencode-ai@${{ steps.frozen.outputs.opencode_version }}"
          sudo install "$(readlink -f "$HOME/.bun/bin/opencode")" /usr/local/bin/opencode
          test "$(opencode --version)" = "${{ steps.frozen.outputs.opencode_version }}"

      - name: Prepare production reviewer
        run: env GITHUB_WORKSPACE="$CONTROL_REPO" just -f "$INFRA/ci/runner.just" prepare

      - name: Select reviewer model outside the reviewer repository
        run: |
          jq --arg model "$REPLAY_MODEL" '.model = $model' \
            /home/reviewer/.config/opencode/opencode.json >"$RUNNER_TEMP/opencode.json"
          sudo install -o reviewer -g reviewer -m 0644 \
            "$RUNNER_TEMP/opencode.json" /home/reviewer/.config/opencode/opencode.json
          env GITHUB_WORKSPACE="$CONTROL_REPO" just -f "$INFRA/ci/runner.just" check-reviewer-model

      - name: Stage frozen pull request diff
        run: env GITHUB_WORKSPACE="$CONTROL_REPO" just -f "$INFRA/ci/runner.just" stage-pr-diff "${{ steps.frozen.outputs.base_ref }}"

      - name: Run production review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          env GITHUB_WORKSPACE="$CONTROL_REPO" \
            just -f "$INFRA/ci/runner.just" run-review \
              "${{ steps.frozen.outputs.report_type }}" \
              "${{ steps.frozen.outputs.scope }}" 2>&1 | tee "$RUNNER_TEMP/replay.log"

      - name: Collect replay evidence
        if: always()
        run: |
          mkdir -p "$RESULT_DIRECTORY"
          cp "$RUNNER_TEMP/replay.log" "$RESULT_DIRECTORY/replay.log"
          cp /home/reviewer/repo/.agents/review-runner/task.md "$RESULT_DIRECTORY/model-prompt.md"
          if test -f /home/reviewer/repo/.agents/review-runner/candidates/submitted.json; then
            cp /home/reviewer/repo/.agents/review-runner/candidates/submitted.json "$RESULT_DIRECTORY/submitted.json"
          fi
          if test -f /home/reviewer/repo/.review-report-artifact.json; then
            cp /home/reviewer/repo/.review-report-artifact.json "$RESULT_DIRECTORY/report.json"
          fi
          uv run automated-reviews inspect "$CASE_DIRECTORY" >"$RESULT_DIRECTORY/case.json"
          printf '%s\n' "$REPLAY_MODEL" >"$RESULT_DIRECTORY/model.txt"

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-${{ inputs.case }}
          path: results
          if-no-files-found: error
          retention-days: 90
