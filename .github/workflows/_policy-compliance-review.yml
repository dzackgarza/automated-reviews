name: Policy Compliance Review (reusable)

on:
  workflow_call:
    inputs:
      scope:
        description: 'Review scope: repo or diff'
        required: true
        type: string
      policy_document:
        description: 'Repository-relative policy document containing permanent policy IDs'
        required: false
        type: string
        default: 'CONTRIBUTING.md'
      infra_ref:
        description: 'Git ref of automated-reviews to run with'
        required: false
        type: string
        default: 'main'
      advisory:
        description: 'Publish findings without enforcing review status'
        required: false
        type: boolean
        default: false
      delivery:
        description: 'Findings ledger: sarif or issues'
        required: false
        type: string
        default: 'sarif'
      parent_issue:
        description: 'Parent issue for issue-ledger delivery; 0 means none'
        required: false
        type: number
        default: 0

jobs:
  policy-compliance-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
      issues: write
    env:
      COMPLIANCE_REVIEW_SCOPE: ${{ inputs.scope }}
      COMPLIANCE_POLICY_DOCUMENT: ${{ inputs.policy_document }}
      COMPLIANCE_REVIEW_INFRA_REF: ${{ inputs.infra_ref }}
      COMPLIANCE_REVIEW_PR_NUMBER: ${{ github.event.number || 0 }}
      COMPLIANCE_REVIEW_BASE_REF: ${{ github.base_ref }}
      COMPLIANCE_REVIEW_DELIVERY: ${{ inputs.delivery }}
      COMPLIANCE_REVIEW_PARENT_ISSUE: ${{ inputs.parent_issue }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Locate infrastructure clone path
        run: echo "INFRA=$RUNNER_TEMP/automated-reviews" >> "$GITHUB_ENV"

      - name: Validate policy-compliance inputs
        run: |
          case "$COMPLIANCE_REVIEW_SCOPE" in
            repo|diff) ;;
            *) echo "invalid scope: $COMPLIANCE_REVIEW_SCOPE" >&2; exit 1 ;;
          esac
          if [[ ! "$COMPLIANCE_REVIEW_PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "invalid pull request number: $COMPLIANCE_REVIEW_PR_NUMBER" >&2; exit 1
          fi
          if [[ -z "$COMPLIANCE_REVIEW_INFRA_REF" || "$COMPLIANCE_REVIEW_INFRA_REF" =~ [^A-Za-z0-9._/-] ]]; then
            echo "invalid infra_ref: $COMPLIANCE_REVIEW_INFRA_REF" >&2; exit 1
          fi
          if [[ "$COMPLIANCE_REVIEW_BASE_REF" =~ [^A-Za-z0-9._/-] ]]; then
            echo "invalid base_ref: $COMPLIANCE_REVIEW_BASE_REF" >&2; exit 1
          fi
          if [[ "$COMPLIANCE_REVIEW_SCOPE" == "diff" && -z "$COMPLIANCE_REVIEW_BASE_REF" ]]; then
            echo "base_ref is required for diff scope" >&2; exit 1
          fi
          if [[ -z "$COMPLIANCE_POLICY_DOCUMENT" || "$COMPLIANCE_POLICY_DOCUMENT" == /* || "$COMPLIANCE_POLICY_DOCUMENT" == *..* ]]; then
            echo "invalid policy document: $COMPLIANCE_POLICY_DOCUMENT" >&2; exit 1
          fi
          test -f "$COMPLIANCE_POLICY_DOCUMENT"
          case "$COMPLIANCE_REVIEW_DELIVERY" in
            sarif|issues) ;;
            *) echo "invalid delivery: $COMPLIANCE_REVIEW_DELIVERY" >&2; exit 1 ;;
          esac

      - name: Clone review infrastructure
        run: git clone --depth 1 --branch "$COMPLIANCE_REVIEW_INFRA_REF" https://github.com/dzackgarza/automated-reviews.git "$INFRA"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          github-token: ${{ github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install tools
        run: just -f "$INFRA/ci/runner.just" install-tools

      - name: Fetch policy-compliance context
        env:
          GH_TOKEN: ${{ github.token }}
        run: just -f "$INFRA/ci/runner.just" fetch-policy-compliance-context "$COMPLIANCE_REVIEW_PR_NUMBER"

      - name: Prepare policy reviewer
        run: just -f "$INFRA/ci/runner.just" prepare

      - name: Check review model
        run: just -f "$INFRA/ci/runner.just" check-reviewer-model

      - name: Stage PR diff
        if: inputs.scope == 'diff'
        run: just -f "$INFRA/ci/runner.just" stage-pr-diff "$COMPLIANCE_REVIEW_BASE_REF"

      - name: Run policy compliance review
        run: just -f "$INFRA/ci/runner.just" run-policy-compliance-review "$COMPLIANCE_REVIEW_SCOPE" "$COMPLIANCE_POLICY_DOCUMENT"

      - name: Collect review output
        run: just -f "$INFRA/ci/runner.just" collect-output

      - name: Write structured review state
        run: just -f "$INFRA/ci/runner.just" write-review-state

      - name: Upload structured review state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-policy-compliance-review-state
          path: .review-findings.json

      - name: Convert report to SARIF
        if: inputs.delivery == 'sarif'
        run: just -f "$INFRA/ci/runner.just" convert-sarif "ai-policy-compliance-review"

      - name: Upload policy findings
        if: inputs.delivery == 'sarif'
        uses: github/codeql-action/upload-sarif@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827
        with:
          sarif_file: .review-report.sarif
          category: ai-policy-compliance-review

      - name: Publish findings to issues ledger
        if: inputs.delivery == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: just -f "$INFRA/ci/runner.just" publish-issues "$COMPLIANCE_REVIEW_PARENT_ISSUE"

      - name: Post policy-compliance threads
        if: inputs.scope == 'diff'
        env:
          GH_TOKEN: ${{ github.token }}
        run: just -f "$INFRA/ci/runner.just" post-threads "$COMPLIANCE_REVIEW_PR_NUMBER"

      - name: Enforce policy-compliance status
        if: ${{ !inputs.advisory }}
        run: just -f "$INFRA/ci/runner.just" enforce-review-status
