name: Slop Review (reusable)

on:
  workflow_call:
    inputs:
      scope:
        description: 'Slop-review scope: repo or diff'
        required: true
        type: string
      infra_ref:
        description: 'Git ref of automated-reviews to run with'
        required: false
        type: string
        default: 'main'
      advisory:
        description: 'Advisory mode: findings are published to the ledger but never fail the run'
        required: false
        type: boolean
        default: false
      policy_paths:
        description: 'Newline-delimited repo-relative policy documents inlined into the slop-review prompt'
        required: false
        type: string
        default: ''
      context_archive:
        description: 'Repo-relative tar archive of slop-review context; SLOP_FOCUS.md and Markdown policy references enter the model prompt'
        required: false
        type: string
        default: ''
      delivery:
        description: 'Findings ledger: sarif (code scanning) or issues (fingerprint-tracked GitHub issues; requires issues: write)'
        required: false
        type: string
        default: 'sarif'
      parent_issue:
        description: 'Grouping issue number new issue-ledger findings are attached under as sub-issues (issues delivery only; 0 = none)'
        required: false
        type: number
        default: 0

      slop_focus:
        description: 'Repository guidance that prioritizes surfaces for policy-index slop violations without expanding finding eligibility'
        required: false
        type: string
        default: ''
jobs:
  slop-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
      issues: write
    env:
      SLOP_REVIEW_SCOPE: ${{ inputs.scope }}
      SLOP_REVIEW_INFRA_REF: ${{ inputs.infra_ref }}
      SLOP_REVIEW_PR_NUMBER: ${{ github.event.number || 0 }}
      SLOP_REVIEW_BASE_REF: ${{ github.base_ref }}
      SLOP_REVIEW_POLICY_PATHS: ${{ inputs.policy_paths }}
      SLOP_REVIEW_FOCUS: ${{ inputs.slop_focus }}
      SLOP_REVIEW_CONTEXT_ARCHIVE: ${{ inputs.context_archive }}
      SLOP_REVIEW_DELIVERY: ${{ inputs.delivery }}
      SLOP_REVIEW_PARENT_ISSUE: ${{ inputs.parent_issue }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name:
          Locate infrastructure clone path
          # The `runner` context is unavailable in job-level `env`; export the
          # path once so every later step's shell sees $INFRA.
        run: echo "INFRA=$RUNNER_TEMP/automated-reviews" >> "$GITHUB_ENV"

      - name: Validate slop-review inputs
        run: |
          case "$SLOP_REVIEW_SCOPE" in
            repo|diff) ;;
            *) echo "invalid scope: $SLOP_REVIEW_SCOPE" >&2; exit 1 ;;
          esac
          if [[ ! "$SLOP_REVIEW_PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "invalid pull request number: $SLOP_REVIEW_PR_NUMBER" >&2
            exit 1
          fi
          if [[ -z "$SLOP_REVIEW_INFRA_REF" || "$SLOP_REVIEW_INFRA_REF" =~ [^A-Za-z0-9._/-] ]]; then
            echo "invalid infra_ref: $SLOP_REVIEW_INFRA_REF" >&2
            exit 1
          fi
          if [[ "$SLOP_REVIEW_BASE_REF" =~ [^A-Za-z0-9._/-] ]]; then
            echo "invalid base_ref: $SLOP_REVIEW_BASE_REF" >&2
            exit 1
          fi
          if [[ "$SLOP_REVIEW_SCOPE" == "diff" && -z "$SLOP_REVIEW_BASE_REF" ]]; then
            echo "base_ref is required for diff scope" >&2
            exit 1
          fi
          case "$SLOP_REVIEW_DELIVERY" in
            sarif|issues) ;;
            *) echo "invalid delivery: $SLOP_REVIEW_DELIVERY" >&2; exit 1 ;;
          esac
          if [[ ! "$SLOP_REVIEW_PARENT_ISSUE" =~ ^[0-9]+$ ]]; then
            echo "invalid parent_issue: $SLOP_REVIEW_PARENT_ISSUE" >&2
            exit 1
          fi

      - name: Clone slop-review infrastructure
        run: git clone --depth 1 --branch "$SLOP_REVIEW_INFRA_REF" https://github.com/dzackgarza/automated-reviews.git "$INFRA"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'

      - name:
          Install just
          # Authenticated install via the maintained action. Mirrors _qc.yml.
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          github-token: ${{ github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install tools
        run: just -f "$INFRA/ci/runner.just" install-tools

      - name: Fetch slop context
        env:
          GH_TOKEN: ${{ github.token }}
        run: just -f "$INFRA/ci/runner.just" fetch-slop-context "ai-review/slop" "$SLOP_REVIEW_PR_NUMBER"

      - name: Prepare slop reviewer
        run: just -f "$INFRA/ci/runner.just" prepare

      - name: Check slop-review model
        run: just -f "$INFRA/ci/runner.just" check-reviewer-model

      - name: Stage PR diff
        if: inputs.scope == 'diff'
        run: just -f "$INFRA/ci/runner.just" stage-pr-diff "$SLOP_REVIEW_BASE_REF"

      - name: Stage slop context packet
        if: inputs.context_archive != ''
        run: just -f "$INFRA/ci/runner.just" stage-context-packet "$SLOP_REVIEW_CONTEXT_ARCHIVE"

      - name: Run slop review
        run: just -f "$INFRA/ci/runner.just" run-slop-review "$SLOP_REVIEW_SCOPE"

      - name: Collect slop-review output
        run: just -f "$INFRA/ci/runner.just" collect-output

      - name: Write structured slop-review state
        run: just -f "$INFRA/ci/runner.just" write-review-state

      - name: Upload structured slop-review state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-slop-review-state
          path: .review-findings.json

      - name: Convert report to SARIF
        if: inputs.delivery == 'sarif'
        run: just -f "$INFRA/ci/runner.just" convert-sarif "ai-slop-review"

      - name: Upload slop findings
        if: inputs.delivery == 'sarif'
        uses: github/codeql-action/upload-sarif@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827
        with:
          sarif_file: .review-report.sarif
          category: ai-slop-review

      - name: Publish findings to the issues ledger
        if: inputs.delivery == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: just -f "$INFRA/ci/runner.just" publish-issues "$SLOP_REVIEW_PARENT_ISSUE"

      - name: Post slop-review threads
        if: inputs.scope == 'diff'
        env:
          GH_TOKEN: ${{ github.token }}
        run: just -f "$INFRA/ci/runner.just" post-threads "$SLOP_REVIEW_PR_NUMBER"

      - name:
          Enforce slop review status
          # Advisory runs publish the ledger snapshot but never let findings
          # determine the workflow conclusion; infrastructure failures in the
          # earlier steps still fail the run.
        if: ${{ !inputs.advisory }}
        run: just -f "$INFRA/ci/runner.just" enforce-review-status
