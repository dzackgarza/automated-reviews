[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "automated-reviews"
version = "0.1.0"
description = "Canonical review skills and the bridge-burning policy index"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.12.5",
]

[project.optional-dependencies]
webapp-testing = [
    "playwright>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv.build-backend]
module-name = "automated_reviews"
module-root = "src"
