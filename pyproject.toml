[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "automated-reviews"
version = "0.1.0"
description = "Capture and replay automated code-review environments"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "cyclopts>=4.6.1",
  "pydantic>=2.12.5",
  "sarif-pydantic>=0.6.2",
  "tomli-w>=1.2.0",
  "unidiff>=0.7.5",
]

[project.scripts]
automated-reviews = "automated_reviews.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.uv.build-backend]
module-name = "automated_reviews"
module-root = "src"

[tool.pytest.ini_options]
addopts = "-m 'not replay'"
markers = ["replay: run the production reviewer in the frozen local runner"]
